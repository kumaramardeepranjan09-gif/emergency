name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Firmware safety, simulator, model and JavaScript checks
        run: bash tools/check.sh
      - name: Install pinned ESP32 build tool
        run: python -m pip install platformio==6.1.18
      - name: Create ephemeral build credential
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          Path('firmware/include/secrets.h').write_text('#pragma once\n#define AP_SSID "CI-build-only"\n#define AP_PASSWORD "'+secrets.token_urlsafe(24)+'"\n')
          PY
      - name: Compile ESP32 target
        run: pio run -j 2
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.local/platformio
