[platformio]
src_dir = firmware/src
include_dir = firmware/include

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@2.3.8
  https://github.com/milesburton/Arduino-Temperature-Control-Library.git#4a0ccc11c5ba32a4ebf466d7706178c57a8ef61c
extra_scripts = pre:tools/embed.py
